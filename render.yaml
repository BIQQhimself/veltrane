# VELTRANE on Render — free tier only.
#
# Two services and one database:
#   veltrane-web  static site  Next.js export (frontend/out)      -> https://corvex.fun
#   veltrane-api  web service  FastAPI behind uvicorn             -> https://api.corvex.fun
#   veltrane-db   postgres     primary data store                 (internal only)
#
# Safety defaults are deliberate: live trading off, billing off (no processor is
# connected, so checkout refuses instead of granting plans for free), and the demo
# market-data fallback off so nothing synthetic is ever shown in place of real prices.
#
# Values that must be supplied by a human are marked `sync: false`: Render prompts for
# them when the Blueprint is created and never stores them in this file.

databases:
  - name: veltrane-db
    plan: free
    region: frankfurt
    databaseName: veltrane
    user: veltrane

services:
  - type: web
    name: veltrane-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run at start so a fresh database is always schema-current before the
    # first request. Alembic is idempotent when nothing is pending.
    startCommand: >-
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: VELTRANE_ENV
        value: production
      - key: VELTRANE_DATABASE_URL
        fromDatabase:
          name: veltrane-db
          property: connectionString
      - key: VELTRANE_SECRET_KEY
        generateValue: true
      # 32 random bytes, base64: python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
      # The API refuses to start in production without it.
      - key: VELTRANE_MASTER_ENCRYPTION_KEY
        sync: false
      # Free Postgres caps connections; keep each API process inside that budget.
      - key: VELTRANE_DB_POOL_SIZE
        value: "5"
      - key: VELTRANE_DB_MAX_OVERFLOW
        value: "5"
      - key: VELTRANE_COOKIE_SECURE
        value: "true"
      # corvex.fun and api.corvex.fun are the same site, so Lax cookies are sent; the
      # API also requires the CSRF header on state-changing requests.
      - key: VELTRANE_COOKIE_SAMESITE
        value: lax
      - key: VELTRANE_CORS_ORIGINS
        value: https://corvex.fun,https://www.corvex.fun
      - key: VELTRANE_WEB_BASE_URL
        value: https://corvex.fun
      - key: VELTRANE_API_BASE_URL
        value: https://api.corvex.fun
      # Every request arrives through Render's proxy, so X-Forwarded-For can be believed.
      # Without this, all visitors share one rate-limit bucket.
      - key: VELTRANE_TRUSTED_PROXIES
        value: "*"
      - key: VELTRANE_MARKET_DATA_SOURCE
        value: ccxt
      # No synthetic fallback in production: an unreachable exchange returns an error
      # instead of inventing prices. Set to true only where demo data is acceptable.
      - key: VELTRANE_DEMO_MARKET_DATA_ENABLED
        value: "false"
      - key: VELTRANE_LIVE_TRADING_ENABLED
        value: "false"
      - key: VELTRANE_BILLING_PROVIDER
        value: "off"
      - key: VELTRANE_SCHEDULER_ENABLED
        value: "true"
      # Verification is enforced at login (app/services/auth.py), so this only works once
      # email delivery does. With VELTRANE_EMAIL_PROVIDER=outbox every new signup is locked
      # out at "Verify your email address before signing in" and no mail can reach them.
      # Wire Resend (see DEPLOYMENT_RENDER.md Step 4b) or set this to "false" until you do.
      - key: VELTRANE_REQUIRE_EMAIL_VERIFICATION
        value: "true"
      # Optional: Upstash free Redis for cross-instance rate limiting and caching.
      # The API degrades gracefully when this is empty.
      - key: VELTRANE_REDIS_URL
        sync: false

      # ---- Email (Resend) -------------------------------------------------------
      # "outbox" records messages and sends nothing. That is the correct setting until a
      # domain is verified at Resend and the API key below is filled in; nothing in the
      # product claims delivery it did not get.
      - key: VELTRANE_EMAIL_PROVIDER
        value: outbox
      - key: VELTRANE_RESEND_API_KEY
        sync: false
      # Svix signing secret (whsec_...) for the Resend webhook at
      # https://api.corvex.fun/api/v1/webhooks/resend. Empty means the endpoint refuses
      # every request with 401 instead of trusting an unsigned payload.
      - key: VELTRANE_RESEND_WEBHOOK_SECRET
        sync: false
      # Must be a sender on the domain verified at Resend (SPF + DKIM required).
      - key: VELTRANE_EMAIL_FROM
        value: VELTRANE <notifications@corvex.fun>
      - key: VELTRANE_EMAIL_REPLY_TO
        value: support@corvex.fun

      # ---- Deriv ----------------------------------------------------------------
      # Public client id of the VELTRANE app registered at developers.deriv.com. Empty
      # disables the OAuth button and leaves the manual Personal Access Token path.
      - key: VELTRANE_DERIV_OAUTH_CLIENT_ID
        sync: false
      # Leave empty to derive https://api.corvex.fun/api/v1/deriv/oauth/callback from
      # VELTRANE_API_BASE_URL. If set, it must match Deriv's registered redirect exactly.
      - key: VELTRANE_DERIV_OAUTH_REDIRECT_URI
        sync: false
      # App ID for API-token (PAT) connections. OAuth tokens carry their own app.
      - key: VELTRANE_DERIV_APP_ID
        sync: false

  - type: web
    name: veltrane-web
    runtime: static
    # Static sites are free and served from Render's CDN, so they take neither a plan
    # nor a region; the schema rejects both here. Only the API and database are pinned
    # to frankfurt.
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/out
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VELTRANE_STATIC_EXPORT
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://api.corvex.fun
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
