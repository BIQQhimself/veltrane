name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veltrane
          # Ephemeral container inside the CI job; not a secret, discarded with the job.
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: veltrane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veltrane" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt ruff==0.17.6 pip-audit==2.10.1
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Dependency audit
        working-directory: backend
        run: pip-audit -r requirements.txt --strict
      - name: Migrations
        working-directory: backend
        env:
          VELTRANE_ENV: test
          # Ephemeral CI service container credential; not a secret and discarded with the job.
          VELTRANE_DATABASE_URL: postgresql+psycopg://veltrane:ci_only_not_a_secret@127.0.0.1:5432/veltrane_test
          VELTRANE_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
          VELTRANE_MASTER_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
        run: alembic upgrade head
      - name: Tests
        working-directory: backend
        env:
          VELTRANE_ENV: test
          # Ephemeral CI service container credential; not a secret and discarded with the job.
          VELTRANE_DATABASE_URL: postgresql+psycopg://veltrane:ci_only_not_a_secret@127.0.0.1:5432/veltrane_test
          VELTRANE_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
          VELTRANE_MASTER_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          VELTRANE_REDIS_URL: redis://127.0.0.1:6379/9
          VELTRANE_MARKET_DATA_SOURCE: demo
          VELTRANE_BILLING_PROVIDER: mock
          VELTRANE_LIVE_TRADING_ENABLED: "false"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
